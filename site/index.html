<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a workbench — sticky top bar, module rail on the left, a reading column
   for lessons, and full-width exercise "benches" with editor + output. Teal marks
   SQL, rust marks Bash; everything else stays a cool blue-grey. */
:root {
  --bg: #f2f5f7;
  --surface: #ffffff;
  --surface-2: #e9eef2;
  --ink: #14202b;
  --muted: #586776;
  --line: #d6dee5;
  --sql: #0a7470;
  --sql-soft: #dff1ef;
  --bash: #ad4f16;
  --bash-soft: #f8e7dc;
  --docker: #1f5fa8;
  --docker-soft: #e1ebf8;
  --fastapi: #8a3f9e;
  --fastapi-soft: #f3e6f7;
  --spring: #3f7a1f;
  --spring-soft: #e6f2dc;
  --cicd: #a3336b;
  --cicd-soft: #f8e2ec;
  --aws: #8a6400;
  --aws-soft: #f6edd2;
  --java: #b4441e;
  --java-soft: #f8e3da;
  --design: #3d55b8;
  --design-soft: #e2e7f8;
  --ok: #1d7f47;
  --ok-soft: #dcf2e4;
  --bad: #b7322b;
  --bad-soft: #f9e1df;
  --warn: #9a6512;
  --warn-soft: #f8eed9;
  --code-bg: #f6f8fa;
  --term-bg: #10171e;
  --term-ink: #d8e2ea;
  --term-dim: #7f91a1;
  --term-err: #ff8a80;
  --term-prompt: #7ad3a5;
  --tk-k: #8a2fa8; --tk-s: #1f7a3a; --tk-n: #a35200; --tk-c: #7a8794; --tk-f: #0e5fb0; --tk-v: #a33a1f; --tk-o: #556270;
  --lv1: #2f7d5b; --lv2: #2463a6; --lv3: #8a4bb0; --lv4: #b03838;
  --shadow: 0 1px 2px rgba(20, 32, 43, .06), 0 2px 8px rgba(20, 32, 43, .05);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --trk: var(--sql);
  --trk-soft: var(--sql-soft);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1419; --surface: #151d24; --surface-2: #1c262f; --ink: #e1e8ee; --muted: #93a3b2; --line: #26323d;
    --sql: #43c2b8; --sql-soft: #12302e; --bash: #f0905a; --bash-soft: #3a2316; --docker: #6aa8f0; --docker-soft: #132a45; --fastapi: #d38cf0; --fastapi-soft: #33183d; --spring: #8bcf5f; --spring-soft: #1d3112; --cicd: #f08fbf; --cicd-soft: #3a1527; --aws: #e8c15a; --aws-soft: #33280c; --java: #f59872; --java-soft: #3b1d12; --design: #8fa3f5; --design-soft: #1b2347;
    --ok: #4cc27f; --ok-soft: #12301f; --bad: #ff7b72; --bad-soft: #3a1714; --warn: #e3b05b; --warn-soft: #34270f;
    --code-bg: #111920; --term-bg: #0a0f14;
    --tk-k: #d38cf0; --tk-s: #7fd18f; --tk-n: #f0a868; --tk-c: #6f7f8d; --tk-f: #6cb4ff; --tk-v: #ff9b7a; --tk-o: #9fb0bf;
    --lv1: #5fcf9c; --lv2: #6aa9ef; --lv3: #c38df0; --lv4: #f08080;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1419; --surface: #151d24; --surface-2: #1c262f; --ink: #e1e8ee; --muted: #93a3b2; --line: #26323d;
  --sql: #43c2b8; --sql-soft: #12302e; --bash: #f0905a; --bash-soft: #3a2316; --docker: #6aa8f0; --docker-soft: #132a45; --fastapi: #d38cf0; --fastapi-soft: #33183d; --spring: #8bcf5f; --spring-soft: #1d3112; --cicd: #f08fbf; --cicd-soft: #3a1527; --aws: #e8c15a; --aws-soft: #33280c; --java: #f59872; --java-soft: #3b1d12; --design: #8fa3f5; --design-soft: #1b2347;
  --ok: #4cc27f; --ok-soft: #12301f; --bad: #ff7b72; --bad-soft: #3a1714; --warn: #e3b05b; --warn-soft: #34270f;
  --code-bg: #111920; --term-bg: #0a0f14;
  --tk-k: #d38cf0; --tk-s: #7fd18f; --tk-n: #f0a868; --tk-c: #6f7f8d; --tk-f: #6cb4ff; --tk-v: #ff9b7a; --tk-o: #9fb0bf;
  --lv1: #5fcf9c; --lv2: #6aa9ef; --lv3: #c38df0; --lv4: #f08080;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
.t-bash { --trk: var(--bash); --trk-soft: var(--bash-soft); }
.t-sql { --trk: var(--sql); --trk-soft: var(--sql-soft); }
.t-docker { --trk: var(--docker); --trk-soft: var(--docker-soft); }
.t-fastapi { --trk: var(--fastapi); --trk-soft: var(--fastapi-soft); }
.t-spring { --trk: var(--spring); --trk-soft: var(--spring-soft); }
.t-cicd { --trk: var(--cicd); --trk-soft: var(--cicd-soft); }
.t-aws { --trk: var(--aws); --trk-soft: var(--aws-soft); }
.t-java { --trk: var(--java); --trk-soft: var(--java-soft); }
.t-design { --trk: var(--design); --trk-soft: var(--design-soft); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
table { font: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--trk); }
code, pre, kbd, textarea.editor { font-family: var(--f-mono); }
:focus-visible { outline: 2px solid var(--trk); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; letter-spacing: -0.01em; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1440px; margin: 0 auto; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; white-space: nowrap; }
.brand-mark { display: inline-grid; grid-template-columns: auto auto; align-items: center; gap: 2px; font-family: var(--f-mono); font-weight: 600; font-size: 15px; }
.brand-mark span { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: #fff; }
.brand-mark .bm-pipe { background: var(--bash); }
.brand-mark .bm-join { background: var(--sql); font-size: 16px; }
.track-switch { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.track-switch a { text-decoration: none; color: var(--muted); padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.track-switch a .glyph { font-family: var(--f-mono); }
.track-switch a.on { background: var(--surface); color: var(--trk); box-shadow: var(--shadow); }
.track-switch a.on.sw-sql { color: var(--sql); } .track-switch a.on.sw-bash { color: var(--bash); } .track-switch a.on.sw-docker { color: var(--docker); } .track-switch a.on.sw-fastapi { color: var(--fastapi); } .track-switch a.on.sw-spring { color: var(--spring); } .track-switch a.on.sw-cicd { color: var(--cicd); } .track-switch a.on.sw-aws { color: var(--aws); } .track-switch a.on.sw-java { color: var(--java); } .track-switch a.on.sw-design { color: var(--design); }
.track-switch { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.track-switch::-webkit-scrollbar { display: none; }
.track-switch a { white-space: nowrap; }
.topnav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.topnav a { text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 700; padding: 6px 10px; border-radius: 8px; }
.topnav a:hover { color: var(--ink); background: var(--surface-2); }
.topnav a.on { color: var(--trk); background: var(--trk-soft); }
.menu-btn { display: none; background: var(--surface-2); border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 14px; cursor: pointer; }

/* ---------- shell layout ---------- */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); max-width: 1440px; margin: 0 auto; min-height: calc(100vh - 60px); }
.rail { border-right: 1px solid var(--line); padding: 20px 14px 40px max(14px, env(safe-area-inset-left, 0px)); position: sticky; top: calc(57px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 57px - env(safe-area-inset-top, 0px)); overflow-y: auto; }
.rail-head { padding: 0 8px 14px; }
.rail-head .eyebrow { margin-bottom: 4px; }
.rail-title { font-family: var(--f-display); font-weight: 800; font-size: 22px; margin: 0 0 8px; }
.meter { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--trk); border-radius: 99px; transition: width .4s; }
.meter-label { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.mods { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.mods a { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.3; }
.mods a:hover { background: var(--surface-2); }
.mods a.on { background: var(--trk-soft); color: var(--ink); font-weight: 700; }
.mods .num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.mods .cnt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mods .cnt.done { color: var(--ok); font-weight: 700; }
.rail-sep { height: 1px; background: var(--line); margin: 14px 8px; }
.rail-links { display: grid; gap: 2px; }
.rail-links a { padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14.5px; display: flex; gap: 10px; align-items: center; }
.rail-links a:hover { background: var(--surface-2); }
.rail-links a.on { background: var(--trk-soft); font-weight: 700; }
.rail-links .ico { width: 18px; text-align: center; font-family: var(--f-mono); color: var(--trk); font-weight: 600; }
main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 900px; margin: 0 auto; }
.page.wide { max-width: 1180px; }

/* ---------- type ---------- */
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.eyebrow .trk { color: var(--trk); }
.page-title { font-size: clamp(30px, 5vw, 44px); font-weight: 800; margin: 6px 0 10px; letter-spacing: -0.025em; }
.lede { font-size: 18px; color: var(--muted); max-width: 62ch; margin: 0 0 18px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.trk { background: var(--trk-soft); color: var(--trk); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 48px 0 14px; padding-top: 18px; border-top: 2px solid var(--ink); }
.section-head h2 { margin: 0; font-size: 26px; }
.section-head .aside { color: var(--muted); font-size: 14px; }

.prose { max-width: 70ch; }
.prose h2 { font-size: 26px; margin: 40px 0 10px; }
.prose h3 { font-size: 20px; margin: 28px 0 8px; }
.prose p, .prose li { color: var(--ink); }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin: 4px 0; }
.prose code, .q-text code, .ex-prompt code, .callout code, .md-table code, .why code { font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.prose .codeblock, .prose .table-wrap, .prose .callout { max-width: none; }
.lesson-wide { max-width: none; }
.table-wrap { overflow-x: auto; margin: 14px 0 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.md-table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.md-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface-2); }
.md-table th, .md-table td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.md-table tr:last-child td { border-bottom: 0; }
.callout { border-radius: var(--radius); padding: 12px 16px; margin: 18px 0; background: var(--surface); border: 1px solid var(--line); }
.callout-title { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 2px; }
.callout p { margin: 6px 0; }
.callout-tip { background: var(--ok-soft); border-color: transparent; } .callout-tip .callout-title { color: var(--ok); }
.callout-warn { background: var(--warn-soft); border-color: transparent; } .callout-warn .callout-title { color: var(--warn); }
.callout-exam { background: var(--trk-soft); border-color: transparent; } .callout-exam .callout-title { color: var(--trk); }
.callout-note .callout-title { color: var(--muted); }
.callout-project { background: var(--trk-soft); border-color: var(--trk); border-left-width: 4px; } .callout-project .callout-title { color: var(--trk); }
.callout-plain .callout-title { color: var(--lv2); }
.callout-mistake { background: var(--bad-soft); border-color: transparent; } .callout-mistake .callout-title { color: var(--bad); }
.lvl.proj { color: var(--trk); background: var(--trk-soft); margin-left: 6px; }
.callout-why .callout-title { color: var(--lv3); }

/* ---------- code blocks ---------- */
.codeblock { position: relative; margin: 14px 0 18px; border-radius: var(--radius); background: var(--code-bg); border: 1px solid var(--line); }
.codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 14px; line-height: 1.55; }
.codeblock.runnable pre { padding-right: 120px; }
.code-label { font-size: 12px; color: var(--muted); padding: 8px 16px 0; font-family: var(--f-mono); }
.code-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.code-actions button { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 10px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ink); }
.code-actions button.run { background: var(--trk); color: #fff; border-color: var(--trk); }
.codeblock textarea.editor { border-radius: 0; border: 0; border-bottom: 1px solid var(--line); background: var(--code-bg); }
.code-out { border-top: 1px dashed var(--line); padding: 10px 12px 12px; }
.tk-k { color: var(--tk-k); font-weight: 600; } .tk-s { color: var(--tk-s); } .tk-n { color: var(--tk-n); } .tk-c { color: var(--tk-c); font-style: italic; }
.tk-f { color: var(--tk-f); } .tk-v { color: var(--tk-v); } .tk-o { color: var(--tk-o); } .tk-p { color: var(--tk-k); font-weight: 600; }

/* ---------- result tables & terminal output ---------- */
.res-meta { font-size: 12.5px; color: var(--muted); margin: 0 0 6px; font-variant-numeric: tabular-nums; display: flex; gap: 10px; flex-wrap: wrap; }
.res-wrap { overflow: auto; max-height: 360px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.res { border-collapse: collapse; font-family: var(--f-mono); font-size: 13px; width: max-content; min-width: 100%; }
.res th { position: sticky; top: 0; background: var(--surface-2); text-align: left; font-weight: 600; color: var(--ink); }
.res th, .res td { padding: 5px 12px; border-bottom: 1px solid var(--line); white-space: pre; }
.res td.num { text-align: right; font-variant-numeric: tabular-nums; }
.res td.null { color: var(--muted); font-style: italic; }
.res tr.miss td { background: var(--bad-soft); }
.err-box { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-family: var(--f-mono); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.ok-box { background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.termout { background: var(--term-bg); color: var(--term-ink); border-radius: 8px; padding: 10px 14px; font-family: var(--f-mono); font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; overflow-x: auto; max-height: 380px; overflow-y: auto; margin: 0; }
.termout .err { color: var(--term-err); }
.termout .dim { color: var(--term-dim); }
.termout .ps { color: var(--term-prompt); }
.termout:empty::before { content: "(no output)"; color: var(--term-dim); }

/* ---------- editor ---------- */
textarea.editor { display: block; width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--code-bg); font-size: 14px; line-height: 1.55; tab-size: 2; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
textarea.editor:focus { outline: 2px solid var(--trk); outline-offset: -1px; border-color: transparent; }
.editor-label { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; flex-wrap: wrap; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 14px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--trk); color: #fff; border-color: var(--trk); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.kbd-hint { font-size: 12px; color: var(--muted); margin-left: auto; }
kbd { font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

/* ---------- exercises ---------- */
.ex-filter { display: flex; gap: 6px; flex-wrap: wrap; }
.ex-filter button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
.ex-filter button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ex-list { display: grid; gap: 18px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.ex.solved { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.ex-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ex-title { font-family: var(--f-display); font-weight: 700; font-size: 18px; margin: 0; flex: 1 1 200px; min-width: 0; }
.ex-num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.lvl { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.lvl-1 { color: var(--lv1); } .lvl-2 { color: var(--lv2); } .lvl-3 { color: var(--lv3); } .lvl-4 { color: var(--lv4); background: color-mix(in srgb, var(--lv4) 10%, transparent); }
.solved-tag { font-size: 13px; font-weight: 700; color: var(--ok); display: none; }
.ex.solved .solved-tag { display: inline; }
.ex-body { padding: 14px 16px 16px; display: grid; gap: 12px; }
.ex-prompt p { margin: 0 0 8px; } .ex-prompt p:last-child { margin-bottom: 0; }
.ex-prompt .codeblock { margin: 8px 0; }
.ex-prompt ul, .ex-prompt ol { margin: 6px 0; padding-left: 1.3em; }
